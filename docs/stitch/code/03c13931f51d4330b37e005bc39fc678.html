<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        
        /* Subtle background animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .bg-blob {
            animation: float 15s ease-in-out infinite;
        }
        .bg-blob-delay {
            animation: float 18s ease-in-out infinite reverse;

<body class="bg-light-bg min-h-screen text-on-background font-body-md overflow-x-hidden relative selection:bg-primary-fixed selection:text-on-primary-fixed">

<div class="fixed bottom-[-10%] right-[-5%] w-[50vw] h-[50vw] rounded-full bg-surface-tint/10 blur-[150px] mix-blend-multiply opacity-60 pointer-events-none bg-blob-delay"></div>

</div>

</div>

<script>
        // Simple scroll effect for header
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-sm', 'bg-light-bg/80');
                header.classList.remove('bg-light-bg/60');
            } else {
                header.classList.remove('shadow-sm', 'bg-light-bg/80');
                header.classList.add('bg-light-bg/60');
            }
        });
    </script>
