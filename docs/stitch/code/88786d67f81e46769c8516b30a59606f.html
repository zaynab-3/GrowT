<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .input-glass {
            background: #F0EFF8;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        
        .input-glass:focus {
            border-color: #5e3bdb;
            box-shadow: 0 0 0 2px rgba(94, 59, 219, 0.2);
            background: #ffffff;
        }
        
        .bg-pattern {
            background-color: #F0EFF8;
            background-image: radial-gradient(#cabeff 1px, transparent 1px);
            background-size: 24px 24px;
        }

<body class="bg-pattern min-h-screen flex items-center justify-center p-gutter-md font-body-md text-on-surface antialiased">
<!-- Register Canvas -->
<main class="w-full max-w-md">
<!-- Logo / Brand Anchor -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">GrowT</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Start your journey to organized serenity.</p>
</div>
<!-- Registration Card -->
<div class="glass-panel rounded-[18px] shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] p-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-6">Create Account</h2>
<form action="#" class="space-y-stack-gap" method="POST">
<!-- Display Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="displayName">Display Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">badge</span>
<input class="input-glass w-full rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none" id="displayName" name="displayName" placeholder="How should we call you?" required="" type="text"/>
</div>
</div>
<!-- Username Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">alternate_email</span>
<input class="input-glass w-full rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none" id="username" name="username" placeholder="unique_handle" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="input-glass w-full rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="input-glass w-full rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none" id="password" name="password" placeholder="Create a strong password" required="" type="password"/>
</div>
<p class="font-label-md text-label-md text-outline-variant mt-2 font-normal">Must be at least 8 characters.</p>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-title-lg text-title-lg rounded-xl py-3 mt-4 transition-all duration-300 hover:-translate-y-[2px] hover:shadow-md flex items-center justify-center gap-2 group" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-6">
<div class="h-[1px] bg-outline-variant flex-1 opacity-50"></div>
<span class="font-label-md text-label-md text-outline-variant uppercase">or</span>
<div class="h-[1px] bg-outline-variant flex-1 opacity-50"></div>
</div>
<!-- Login Link -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:text-primary-container transition-colors" href="#">Login</a>
</p>
</div>
</div>
</main>
