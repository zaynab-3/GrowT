<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GrowT - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-light-bg text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center p-4">
<!-- Main Container -->
<main class="w-full max-w-[400px] bg-light-card rounded-[18px] p-container-padding shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] border border-outline-variant/30 relative overflow-hidden">
<!-- Decorative Header Blur -->
<div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-b from-primary-fixed/40 to-transparent -z-10 blur-xl rounded-t-[18px]"></div>
<!-- Header Section -->
<header class="text-center mb-8">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-2">GrowT</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Please login to continue.</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-stack-gap" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full bg-light-bg border border-outline-variant/50 rounded-xl py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-300" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1 mt-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full bg-light-bg border border-outline-variant/50 rounded-xl py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-300" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg rounded-xl py-3 mt-6 shadow-md hover:bg-primary-container hover:-translate-y-[2px] transition-all duration-300 ease-out flex items-center justify-center gap-2" type="submit">
                Login
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center py-4 mt-2">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="flex-shrink-0 mx-4 font-label-md text-label-md text-outline">OR</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<!-- Social Login (Optional/Visual) -->
<button class="w-full bg-white border border-outline-variant/50 text-on-surface font-body-md text-body-md rounded-xl py-3 shadow-sm hover:bg-surface-container-low transition-colors duration-300 flex items-center justify-center gap-3" type="button">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBeSYJfYvZ6n9Bn32W2zcf6WXiKS4eyCW6IL5rnIsFKYQwnmRoFuyN-N2t4Pvjv8CZn7h8mLE6zwbjOc3ZAr-0nQYUOo_HiMJvDZlR7gKJIiairBdACMQCm_aLfmIwxXeHidO2oRGt8sCkUXMHlNBlHwLwylQ4AtzCCEsbrz83wgP2f0qBJBskETE5anCkHFVNrEZNxTmqrYpiH2WiL2XT-HF4ojL9JypkYMAs_Rx0aEpB7zQwilm9bkAy_TkWzytGAfz4gmsZeGu8I"/>
                Continue with Google
            </button>
</form>
<!-- Register Link -->
<div class="text-center mt-8">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-primary-container underline underline-offset-2 transition-colors" href="#">Register</a>
</p>
</div>
</main>
</body></html>
