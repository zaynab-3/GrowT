<html class="light" lang="en"><head>

                    "borderRadius": {

                    },
                    "spacing": {

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-light-bg text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Minimal Header -->
<header class="w-full flex items-center p-margin-sm z-10 sticky top-0 bg-light-bg/80 backdrop-blur-md">
<a class="w-10 h-10 flex items-center justify-center rounded-full bg-light-card shadow-[0_4px_12px_rgba(31,38,135,0.05)] text-on-surface hover:-translate-y-0.5 transition-transform duration-300" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</a>
<div class="flex-grow text-center pr-10">
<span class="font-title-lg text-title-lg text-primary">GrowT</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-sm pb-container-padding pt-4">
<!-- Hero Section -->
<div class="flex flex-col items-center text-center mb-8">
<div class="w-16 h-16 rounded-2xl bg-primary-container text-on-primary-container flex items-center justify-center mb-6 shadow-sm">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-2">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[260px]">Set up your profile to start organizing your projects with clarity.</p>
</div>
<!-- Registration Form Card -->
<form class="glass-panel rounded-xl p-gutter-md shadow-[0_8px_32px_0_rgba(31,38,135,0.07)] flex flex-col gap-gutter-md relative overflow-hidden">
<!-- Decorative background element -->
<div class="absolute -top-20 -right-20 w-40 h-40 bg-primary-fixed rounded-full mix-blend-multiply filter blur-3xl opacity-50 pointer-events-none"></div>
<!-- Input: Display Name -->
<div class="flex flex-col gap-2 relative z-10">
<label class="font-label-md text-label-md text-on-surface ml-1" for="displayName">Display Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-outline shadow-sm hover:border-outline" id="displayName" placeholder="How should we call you?" required="" type="text"/>
</div>
</div>
<!-- Input: Username -->
<div class="flex flex-col gap-2 relative z-10">
<label class="font-label-md text-label-md text-on-surface ml-1" for="username">Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-outline shadow-sm hover:border-outline" id="username" placeholder="unique_user123" required="" type="text"/>
</div>
</div>
<!-- Input: Email -->
<div class="flex flex-col gap-2 relative z-10">
<label class="font-label-md text-label-md text-on-surface ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-outline shadow-sm hover:border-outline" id="email" placeholder="hello@example.com" required="" type="email"/>
</div>
</div>
<!-- Input: Password -->
<div class="flex flex-col gap-2 relative z-10">
<label class="font-label-md text-label-md text-on-surface ml-1" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl py-3.5 pl-12 pr-12 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-outline shadow-sm hover:border-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-2 relative z-10">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-light-card bg-surface-container-lowest transition-all cursor-pointer" id="terms" type="checkbox"/>
</div>
<div class="flex flex-col">
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
</div>
<!-- CTA Button -->
<div class="mt-4 relative z-10">
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-4 rounded-xl shadow-md hover:shadow-lg hover:-translate-y-1 active:translate-y-0 active:shadow-sm transition-all duration-300 flex items-center justify-center gap-2" type="submit">
<span>Register</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Login Redirect -->
<div class="text-center mt-4 relative z-10">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline ml-1" href="#">Sign In</a>
</p>
</div>
</form>
</main>
</body></html>
