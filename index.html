<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GrowT — a calm, intentional workspace for managing folders, tasks, and sustainable growth." />
    <meta name="theme-color" content="#287a5b" />
    <meta name="application-name" content="GrowT" />
    <meta name="apple-mobile-web-app-title" content="GrowT" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#287a5b" />
    <meta name="msapplication-TileImage" content="/logo/icon-192.png" />
    <title>GrowT — Grow with intention</title>
    <script>
      ;(function () {
        var storedThemeMode

        try {
          storedThemeMode = window.localStorage.getItem('growt:themeMode')
        } catch (error) {
          storedThemeMode = null
        }

        var preference = storedThemeMode === 'light' || storedThemeMode === 'dark' || storedThemeMode === 'system'
          ? storedThemeMode
          : 'system'
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var resolvedThemeMode = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference

        document.documentElement.classList.toggle('dark', resolvedThemeMode === 'dark')
        document.documentElement.setAttribute('data-theme', resolvedThemeMode)
        document.documentElement.setAttribute('data-theme-preference', preference)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
